<!DOCTYPE html>
<html>
    <head>
        <title>Url shortener</title>
        <link rel="stylesheet" type="text/css" href="/static/common.css">
        <script lang="javascript" src="/static/common.js"></script>
    </head>
    <body>
        <header>
            <p>header</p>
        </header>
        <div class="centered-container">
            <div class="centered-center round-corners">
                <center>
                    <h1>URL shortener</h1>
                    <hr>
                    <div style="display: flex;">
                        <form action="/api/v1/login" method="post" enctype="application/x-www-form-urlencoded">
                            <input type="email" name="username" placeholder="Your email" required />
                            <br/>
                            <input type="password" name="password" placeholder="Your password" required />
                            <br/>
                            <input type="submit" value="Log-in" />
                        </form>
                    </div>
                </center>
            </div>
        </div>
        <footer>
            <p>footer</p>
        </footer>
    </body>
</html>
