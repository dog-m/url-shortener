{% extends 'user/base.html' %}

{% set PAGE = 'profile' %}

{% block title %}Profile / {{ super() }}{% endblock %}

{%- block head -%}
<script lang="javascript">
    var patch_version = parseInt('{{ user.version }}');

    function update_profile(e) {
        // prepare for the upload
        e.preventDefault();
        let msg = document.getElementById('msg');
        msg.classList.remove('msg-ok', 'msg-err');
        msg.textContent = '';

        let on_err = (reason) => {
            msg.classList.add('msg-err');
            msg.textContent = `Unable to update the entry.`;
            console.error('Entry update error', reason);
        };

        // collect the data
        let form = new FormData(e.srcElement);
        let patch = {};

        let apply = (fieldName) => {
            if (value = form.get(fieldName))
                patch[fieldName] = value;
        };

        apply('name');
        apply('email');
        apply('password');
        console.log(form, patch);

        // make the request only if there is something to upload, otherwise do nothing
        if (Object.keys(patch).length !== 0) {
            fetch(
                `/api/v1/user/{{ user.id }}?v=${patch_version}`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(patch),
                    redirect: 'error',
                    credentials: 'same-origin',
                    signal: AbortSignal.timeout(5 * 1000),
                }
            )
            .then(async (value) => {
                if (value.ok) {
                    // regenerate the page
                    window.location.reload();
                } else {
                    on_err(await value.json());
                }
            })
            .catch(on_err);
        }

        return false;
    }
</script>
{%- endblock -%}

{%- block page_content -%}
<h4>Profile</h4>
<p>Greetings, {{ user.name | e }}.</p>
<form onsubmit="return update_profile(event);" autocomplete="off">
    <div>
        <label for="name">New name:</label>
        <input type="text" name="name" placeholder="Your new name" />
    </div>
    <div>
        <label for="email">New E-mail:</label>
        <input type="email" name="email" placeholder="Your new email" />
    </div>
    <div>
        <label for="password">New password:</label>
        <input type="password" name="password" placeholder="Your new password" />
    </div>
    <input type="submit" value="Update">
</form>
<div id="msg"></div>
<p>
    <i>Last update: <script lang="javascript"> localize_time('{{- user.updated_at -}}'); </script></i>
</p>
<form method="post" action="/api/v1/logout">
    <button type="submit">Log-out</button>
</form>
{%- endblock -%}
