<!DOCTYPE html>
<html>
    <head>
        <title>URL Shortener service</title>
        <link rel="stylesheet" type="text/css" href="/static/common.css">
        <script lang="javascript" src="/static/common.js"></script>
        <script lang="javascript">
            var is_loaded = false;
            const PAGE_CONTAINER_ID     = 'pages';
            const PAGE_ATTR_ACTIVE_NAME = 'page-active';

            function switchPageById(target_id) {
                // hide currently active page
                for (let page of document.getElementById(PAGE_CONTAINER_ID).children)
                    if (page.hasAttribute(PAGE_ATTR_ACTIVE_NAME)) {
                        page.removeAttribute(PAGE_ATTR_ACTIVE_NAME);
                        break;
                    }

                // show requested page
                let page = document.getElementById(target_id);
                if (page !== null)
                    page.setAttribute(PAGE_ATTR_ACTIVE_NAME, '');
            }

            function switchPage(element) {
                let target_id = element.getAttribute('href').replace('#', '');
                switchPageById(target_id);
            }


            function updateUserUrls() {
                // clear things up
                let page = document.getElementById('page-url-list');
                page.innerHTML = '';

                // add placeholder text while we wait for the data
                let text = page.appendChild(document.createElement('p'));
                text.textContent = 'Loading...';

                function on_data(json) {
                    console.info(json);

                    if (json.length === 0) {
                        text.textContent = 'No URLs found';
                    } else {
                        text.textContent = '';
                        for (u of json) {
                            let item = document.createElement('p');
                            item.textContent = JSON.stringify(u);
                            item.classList.add('ellipsis-text');
                            text.appendChild(item);
                        }
                    }
                }

                function on_failure(reason) {
                    text.textContent = 'Unable to fetch URLs.';
                    console.error(reason);
                }

                fetch(
                    '/api/v1/urls', {
                        method: 'GET',
                        redirect: 'error',
                        credentials: 'same-origin',
                        signal: AbortSignal.timeout(5 * 1000),
                    }
                )
                .then((value) => {
                    if (value.ok)
                        value.json().then(on_data);
                    else
                        on_failure('not-ok');
                })
                .catch(on_failure);
            }


            async function debug_add_url() {
                let something = Math.floor(Math.random() * 1000) % 1000;
                await fetch(
                    '/api/v1/urls', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            original_url: `https://google.com/foo?q=${something}`,
                            title: `bar+${something}`,
                            //description: null,
                        }),
                        redirect: 'error',
                        credentials: 'same-origin',
                        signal: AbortSignal.timeout(5 * 1000),
                    }
                )
                .then(async (value) => {
                    console.log('OK:', await value.json());
                })
                .catch((reason) => {
                    console.warn('Not OK:', reason);
                });
            }


            function init() {
                switchPageById('page-user-info');

                is_loaded = true;
                console.info('loaded');
            }

            function destruct() {
                is_loaded = false;
                console.info('unloaded');
            }
        </script>
    </head>
    <body onload="init()" onunload="destruct()">
        <header>
            <nav>
                <div>URL Shortener service.</div>
            </nav>
            <nav>
                <div class="sidebar">
                    <ul>
                        <li><a href="#page-user-info" onclick="switchPage(this)">User info</a></li>
                        <li><a href="#page-url-list"  onclick="switchPage(this); updateUserUrls();">URLs</a></li>
                        <li>
                            <form method="post" action="/api/v1/logout">
                                <button type="submit">Log-out</button>
                            </form>
                        </li>
                        <li>
                            <button type="button" onclick="debug_add_url()">[DEBUG] Add an URL</button>
                        </li>
                    </ul>
                </div>
            </nav>
        </header>
        <main>
            <div id="pages">
                <div class="page" id="page-user-info">
                    <h4>Greetings, {{ user.name | capitalize }}.</h4>
                    <p>User info page.</p>
                    <form method="POST" action="/api/v1/user" enctype="application/x-www-form-urlencoded" autocomplete="off">
                        <input type="hidden" name="id" value="{{ user.id }}" />
                        <input type="hidden" name="is_active" value="{{ user.is_active }}" />
                        <input type="hidden" name="is_superuser" value="{{ user.is_superuser }}" />
                        <div>
                            <label for="name">New name:</label>
                            <input type="text" name="name" placeholder="Your name" />
                        </div>
                        <div>
                            <label for="email">New E-mail:</label>
                            <input type="email" name="email" placeholder="Your email" />
                        </div>
                        <div>
                            <label for="password">New password:</label>
                            <input type="password" name="password" placeholder="Your new password" />
                        </div>
                        <input type="submit" value="Update">
                    </form>
                    <p><i>(Last update: {{ user.updated_at }})</i></p>
                </div>
                <div class="page" id="page-url-list">
                    <p>A list of user's URLs.</p>
                </div>
            </div>
        </main>
    </body>
</html>
