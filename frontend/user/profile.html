{%- endblock -%}

{%- block page_content -%}
<h4>Profile</h4>
<p>Greetings, {{ user.name | e }}.</p>
<form onsubmit="return update_profile(event);" autocomplete="off">
    <div>
        <label for="name">New name:</label>
        <input type="text" name="name" placeholder="Your name" />
    </div>
    <div>
        <label for="email">New E-mail:</label>
        <input type="email" name="email" placeholder="Your email" />
    </div>
    <div>
        <label for="password">New password:</label>
        <input type="password" name="password" placeholder="Your new password" />
    </div>
    <input type="submit" value="Update">
</form>
<p>
    <i>(Last update: {{- user.updated_at -}})</i>
</p>
<form method="post" action="/api/v1/logout">
