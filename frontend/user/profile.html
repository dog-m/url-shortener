{% extends 'user/base.html' %}

{% set PAGE = 'profile' %}

{% block title %}Profile / {{ super() }}{% endblock %}

{%- block head -%}
<style>
    table {
        border: 1px solid #000;
        padding: 15px;
    }
</style>
<script lang="javascript">
    var patch_version = parseInt('{{ user.version }}');

    function update_profile(e) {
        // prepare for the upload
        e.preventDefault();
        let msg = document.getElementById('msg');
        msg.classList.remove('msg-ok', 'msg-err');
        msg.textContent = '';

        let on_err = (reason) => {
            msg.classList.add('msg-err');
            msg.textContent = `Unable to update the entry.`;
            console.error('Entry update error', reason);
        };

        // collect the data
        let form = new FormData(e.srcElement);
        let patch = {};

        let apply = (fieldName) => {
            if (value = form.get(fieldName))
                patch[fieldName] = value;
        };

        apply('name');
        apply('email');
        apply('password');
        console.log(form, patch);

        // make the request only if there is something to upload, otherwise do nothing
        if (Object.keys(patch).length !== 0) {
            fetch(
                `/api/v1/user/{{ user.id }}?v=${patch_version}`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(patch),
                    redirect: 'error',
                    credentials: 'same-origin',
                    signal: AbortSignal.timeout(5 * 1000),
                }
            )
            .then(async (value) => {
                if (value.ok) {
                    // regenerate the page
                    window.location.reload();
                } else {
                    on_err(await value.json());
                }
            })
            .catch(on_err);
        }

        return false;
    }
</script>
{%- endblock -%}

{%- block page_content -%}
<div>
    <h3>Profile</h3>
</div>
<div>
    <p>Greetings, {{ user.name | e }}.</p>
    <form onsubmit="return update_profile(event);" autocomplete="off">
        <table>
            <tr>
                <td>New name:</td>
                <td><input type="text" name="name" placeholder="Your new name" /></td>
            </tr>
            <tr>
                <td>New E-mail:</td>
                <td><input type="email" name="email" placeholder="Your new email" /></td>
            </tr>
            <tr>
                <td>New password:</td>
                <td><input type="password" name="password" placeholder="Your new password" /></td>
            </tr>
            <tr>
                <td colspan="2" style="height: 15px;"></td>
            </tr>
            <tr>
                <td colspan="2"><input type="submit" value="Update" style="width: 100%;"></td>
            </tr>
        </table>
    </form>
    <div id="msg"></div>
</div>
<p>
    <small>
        <i>Last updated: <script lang="javascript"> localize_time('{{- user.updated_at -}}'); </script></i>
    </small>
</p>
<form method="post" action="/api/v1/logout">
    <button type="submit">Log-out</button>
</form>
{%- endblock -%}
